# FMC Dependabot defaults (tech-stack), Astro schedule: first Friday of each month, 07:00 Europe/Berlin.
# Netlify deploy previews for dependabot/* branches are skipped via netlify.toml `ignore`.
# TypeScript stays on 6.x until astro check supports TypeScript 7 (withastro/roadmap#1321).
version: 2
updates:
  - package-ecosystem: bun
    directories:
      - /
    schedule:
      interval: cron
      cronjob: '0 7 * * FRI#1'
      timezone: Europe/Berlin
    cooldown:
      default-days: 5
    open-pull-requests-limit: 1
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    groups:
      security-dev-tools:
        applies-to: security-updates
        patterns:
          - 'oxlint*'
          - 'oxfmt*'
          - 'vitest*'
          - 'knip*'
          - 'husky*'
          - '@types/*'
          - 'typescript'
          - 'browserslist*'
          - 'bun-types'

      app-dev-minor-patch:
        applies-to: version-updates
        patterns:
          - 'husky'
          - 'knip'
          - 'oxfmt'
          - 'oxlint*'
          - 'vitest'
          - '@types/*'
          - 'typescript'
          - 'browserslist'
          - 'browserslist-to-esbuild'
          - 'bun-types'
        update-types:
          - minor
          - patch

      app-framework-minor-patch:
        applies-to: version-updates
        patterns:
          - 'astro'
          - '@astrojs/*'
          - '@tailwindcss/*'
          - 'tailwindcss'
        update-types:
          - minor
          - patch

      app-prod-misc-patch:
        applies-to: version-updates
        update-types:
          - patch
        patterns:
          - '*'
        exclude-patterns:
          - 'astro'
          - '@astrojs/*'
          - '@tailwindcss/*'
          - 'tailwindcss'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: '0 7 * * FRI#1'
      timezone: Europe/Berlin
    cooldown:
      default-days: 5
    open-pull-requests-limit: 1
    labels:
      - dependencies
      - github_actions
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
        patterns:
          - '*'
